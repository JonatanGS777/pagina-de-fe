<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Ministerio "La Gloria es del Señor"</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth.css">
    <style>
        :root {
            --primary-color: #1a1410;
            --secondary-color: #b89a5f;
            --accent-color: #6b4f2a;
            --background-color: #f7f4ed;
            --text-color: #2d2010;
            --light-accent: #ede5d8;
            --gold-accent: #c9aa6a;
            --dark-color: #0e0c0a;
            --gradient-bg: linear-gradient(160deg, #0e0c0a 0%, #1f1a14 100%);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06), 0 6px 12px rgba(0, 0, 0, 0.03);
        }

        body {
            font-family: 'Lato', sans-serif;
            font-weight: 300;
            background: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .profile-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .profile-card {
            background: white;
            border-radius: 4px;
            padding: 40px;
            box-shadow: var(--box-shadow);
            margin-bottom: 24px;
            border: 1px solid rgba(184, 154, 95, 0.15);
            position: relative;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--secondary-color), transparent);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 28px;
            margin-bottom: 36px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--light-accent);
        }

        .profile-photo {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 2px solid rgba(184, 154, 95, 0.5);
            box-shadow: none;
        }

        .profile-info h1 {
            margin: 0 0 6px 0;
            color: var(--primary-color);
            font-size: 2rem;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .profile-info p {
            margin: 4px 0;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .profile-info .email {
            color: var(--accent-color);
            font-weight: 400;
        }

        .profile-info .provider {
            color: var(--secondary-color);
            font-weight: 400;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .profile-info .join-date {
            color: #a0917e;
            font-size: 0.82rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--background-color);
            border: 1px solid rgba(184, 154, 95, 0.2);
            border-radius: 4px;
            padding: 28px 20px;
            text-align: center;
            transition: var(--transition);
            position: relative;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            width: 60%;
            height: 1px;
            background: var(--secondary-color);
            opacity: 0.6;
        }

        .stat-card:hover {
            border-color: rgba(184, 154, 95, 0.45);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .stat-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 600;
            color: var(--secondary-color);
            margin-bottom: 6px;
            line-height: 1;
        }

        .stat-label {
            font-family: 'Lato', sans-serif;
            font-size: 0.68rem;
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #a0917e;
        }

        .activity-section {
            background: white;
            border-radius: 4px;
            padding: 40px;
            box-shadow: var(--box-shadow);
            border: 1px solid rgba(184, 154, 95, 0.15);
            position: relative;
        }

        .activity-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--secondary-color), transparent);
        }

        .activity-section h2 {
            color: var(--primary-color);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.7rem;
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: 0.02em;
        }

        .activity-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px 0;
            margin-bottom: 0;
            background: transparent;
            border-bottom: 1px solid rgba(184, 154, 95, 0.12);
            transition: var(--transition);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item:hover {
            padding-left: 6px;
        }

        .activity-icon {
            width: 36px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary-color);
            font-size: 1rem;
        }

        .activity-content strong {
            color: var(--primary-color);
            font-weight: 400;
            font-size: 0.95rem;
        }

        .activity-content p {
            margin: 3px 0 0 0;
            color: #a0917e;
            font-size: 0.82rem;
        }

        .btn-section {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 26px;
            border-radius: 2px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Lato', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-color);
            border: 1px solid rgba(184, 154, 95, 0.4);
        }

        .btn-secondary:hover {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        .btn-danger {
            background: transparent;
            color: #b91c1c;
            border: 1px solid rgba(185, 28, 28, 0.35);
        }

        .btn-danger:hover {
            background: #b91c1c;
            color: white;
            border-color: #b91c1c;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a0917e;
            text-decoration: none;
            margin-bottom: 28px;
            font-weight: 400;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--secondary-color);
            transform: translateX(-3px);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .profile-container {
                padding: 20px 15px;
            }

            .profile-card {
                padding: 30px 25px;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }

            .profile-photo {
                width: 80px;
                height: 80px;
            }

            .profile-info h1 {
                font-size: 1.8rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .activity-section {
                padding: 30px 25px;
            }

            .btn-section {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }

        /* Loading state */
        .loading-skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <a href="../index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Volver al inicio
        </a>

        <div class="profile-card">
            <div class="profile-header">
                <img id="profile-photo" class="profile-photo" src="https://via.placeholder.com/100x100?text=..." alt="Foto de perfil">
                <div class="profile-info">
                    <h1 id="profile-name">Cargando...</h1>
                    <p id="profile-email" class="email">email@ejemplo.com</p>
                    <p id="profile-provider" class="provider">Conectado con Google</p>
                    <p id="profile-join-date" class="join-date">Miembro desde: ...</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="visit-count">0</div>
                    <div class="stat-label">Visitas totales</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="days-member">0</div>
                    <div class="stat-label">Días como miembro</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="last-visit">Hoy</div>
                    <div class="stat-label">Última visita</div>
                </div>
            </div>

            <div class="btn-section">
                <button class="btn btn-secondary" onclick="clearHistory()">
                    <i class="fas fa-broom"></i>
                    Limpiar historial
                </button>
                <button class="btn btn-danger" onclick="deleteAccount()">
                    <i class="fas fa-trash-alt"></i>
                    Eliminar cuenta
                </button>
            </div>
        </div>

        <div class="activity-section">
            <h2><i class="fas fa-chart-line"></i> Tu actividad reciente</h2>
            <div id="activity-list">
                <div class="activity-item">
                    <div class="activity-icon">
                        <i class="fas fa-home"></i>
                    </div>
                    <div class="activity-content">
                        <strong>Visitaste la página principal</strong>
                        <p>Hace unos momentos</p>
                    </div>
                </div>
                <div class="activity-item">
                    <div class="activity-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <div class="activity-content">
                        <strong>Te registraste exitosamente</strong>
                        <p id="registration-date">Hoy</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/profile.js"></script>
</body>
</html>
