<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="/favicon.ico?v=1" sizes="any">
    <link rel="icon" type="image/png" href="/favicon-16x16.png?v=1" sizes="16x16">
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=1" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon-48x48.png?v=1" sizes="48x48">
    <link rel="icon" type="image/png" href="/favicon-192x192.png?v=1" sizes="192x192">
    <link rel="icon" type="image/png" href="/favicon-512x512.png?v=1" sizes="512x512">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Ministerio "La Gloria es del Señor"</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('profile', {
                name: 'Cargando...',
                email: 'email@ejemplo.com',
                photo: 'https://via.placeholder.com/104x104?text=...',
                provider: 'Conectado con Google',
                joinDateText: 'Miembro desde: ...',
                visitCount: '0',
                daysMemberText: '0',
                lastVisitText: 'Hoy',
                activities: [
                    {
                        icon: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>',
                        title: 'Visitaste la página principal',
                        description: 'Hace unos momentos'
                    },
                    {
                        icon: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 21a8 8 0 0 1 13.292-6" /><circle cx="10" cy="8" r="5" /><path d="M19 16v6" /><path d="M22 19h-6" /></svg>',
                        title: 'Te registraste exitosamente',
                        description: 'Hoy'
                    }
                ]
            });
        });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>
        :root {
            --ink:          #1a1410;
            --gold:         #b89a5f;
            --gold-light:   #d4b87a;
            --parchment:    #f7f4ed;
            --parchment-dk: #ede5d8;
            --accent:       #6b4f2a;
            --text-body:    #2d2010;
            --text-muted:   #a0917e;
            --danger:       #b91c1c;
            --gradient-bg:  linear-gradient(160deg, #0e0c0a 0%, #1f1a14 100%);
            --transition:   all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --box-shadow:   0 12px 24px rgba(0, 0, 0, 0.06), 0 6px 12px rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lato', sans-serif;
            font-weight: 300;
            background: var(--parchment);
            color: var(--text-body);
            min-height: 100vh;
        }

        .ic { width: 1em; height: 1em; vertical-align: -0.15em; flex-shrink: 0; display: inline-block; }

        .page-wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 32px;
            font-weight: 400;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: var(--transition);
        }
        .back-link .ic { font-size: 0.8rem; }
        .back-link:hover { color: var(--gold); transform: translateX(-3px); }

        /* ── FICHA DE MIEMBRO ── */
        .member-card {
            background: white;
            border: 1px solid rgba(184, 154, 95, 0.2);
            box-shadow: var(--box-shadow);
            margin-bottom: 28px;
            overflow: hidden;
        }

        .card-letterhead {
            background: var(--gradient-bg);
            padding: 14px 20px;
            text-align: center;
            position: relative;
        }
        .card-letterhead::after {
            content: '';
            position: absolute;
            left: 50%; bottom: 0;
            transform: translateX(-50%);
            width: 60px; height: 2px;
            background: var(--gold);
            opacity: 0.6;
        }
        .card-letterhead span {
            font-family: 'Lato', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold-light);
        }

        .card-body {
            padding: 44px 40px 36px;
            text-align: center;
        }

        .member-photo-frame {
            position: relative;
            width: 104px;
            height: 104px;
            margin: 0 auto 22px;
        }
        .profile-photo {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
            box-shadow: 0 0 0 5px white, 0 0 0 6px rgba(184, 154, 95, 0.35), 0 8px 18px rgba(0,0,0,0.12);
        }
        .member-badge {
            position: absolute;
            right: -2px; bottom: -2px;
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--gold);
            color: white;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid white;
            font-size: 0.8rem;
        }

        .member-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-style: italic;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.01em;
            margin-bottom: 6px;
        }

        .member-subtitle {
            font-family: 'Lato', sans-serif;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .credential-fields {
            max-width: 380px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-top: 26px;
            border-top: 1px dashed var(--parchment-dk);
        }
        .credential-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.88rem;
            color: var(--text-body);
        }
        .credential-row .ic { color: var(--gold); font-size: 1rem; }
        .credential-row .email { color: var(--accent); font-weight: 400; word-break: break-word; }
        .credential-row .provider {
            color: var(--gold);
            font-weight: 700;
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .credential-row .join-date { color: var(--text-muted); font-size: 0.82rem; }

        /* ── PLACA DE LOGROS ── */
        .achievement-plaque {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid var(--parchment-dk);
            background: var(--parchment);
        }
        .achievement-item {
            padding: 26px 14px;
            text-align: center;
            position: relative;
        }
        .achievement-item + .achievement-item::before {
            content: '';
            position: absolute;
            left: 0; top: 22%; bottom: 22%;
            width: 1px;
            background: rgba(184, 154, 95, 0.3);
        }
        .achievement-icon { color: var(--gold); font-size: 1.1rem; margin-bottom: 10px; }
        .achievement-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.1rem;
            font-weight: 600;
            font-style: italic;
            color: var(--ink);
            line-height: 1;
            margin-bottom: 6px;
        }
        .achievement-label {
            font-family: 'Lato', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* ── ACCIONES ── */
        .account-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            padding: 22px 20px;
            border-top: 1px solid var(--parchment-dk);
            flex-wrap: wrap;
        }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            background: transparent;
            border: 1px solid rgba(184, 154, 95, 0.4);
            color: var(--text-body);
            border-radius: 2px;
            font-family: 'Lato', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
        }
        .action-btn:hover { border-color: var(--gold); color: var(--accent); }
        .action-btn--danger { color: var(--danger); border-color: rgba(185, 28, 28, 0.3); }
        .action-btn--danger:hover { background: var(--danger); color: white; border-color: var(--danger); }

        /* ── BITÁCORA ── */
        .ledger-section {
            background: white;
            border: 1px solid rgba(184, 154, 95, 0.2);
            box-shadow: var(--box-shadow);
            padding: 36px 40px 30px;
        }
        .ledger-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 26px;
        }
        .ledger-title .ic { color: var(--gold); font-size: 1.2rem; }

        #activity-list { position: relative; padding-left: 4px; }
        #activity-list::before {
            content: '';
            position: absolute;
            left: 17px; top: 6px; bottom: 6px;
            width: 1px;
            background: repeating-linear-gradient(to bottom, rgba(184,154,95,0.4) 0 5px, transparent 5px 10px);
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            padding: 14px 0;
            position: relative;
        }
        .activity-item:last-child { padding-bottom: 0; }

        .activity-icon {
            position: relative;
            z-index: 1;
            width: 34px; height: 34px;
            flex-shrink: 0;
            border-radius: 50%;
            background: var(--parchment);
            border: 1px solid rgba(184, 154, 95, 0.4);
            display: flex; align-items: center; justify-content: center;
            color: var(--gold);
            font-size: 0.9rem;
        }

        .activity-content { padding-top: 3px; }
        .activity-content strong {
            display: block;
            color: var(--ink);
            font-weight: 400;
            font-size: 0.92rem;
        }
        .activity-content p {
            margin: 3px 0 0 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 640px) {
            .page-wrap { padding: 24px 16px 40px; }
            .card-body { padding: 34px 22px 28px; }
            .ledger-section { padding: 28px 22px 24px; }
            .member-name { font-size: 1.7rem; }
            .achievement-plaque { grid-template-columns: 1fr; }
            .achievement-item + .achievement-item::before { display: none; }
            .achievement-item { border-top: 1px solid rgba(184,154,95,0.2); }
            .achievement-item:first-child { border-top: none; }
            .account-actions { flex-direction: column; align-items: stretch; }
            .action-btn { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="page-wrap" x-data>
        <a href="../index.html" class="back-link">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>
            Volver al inicio
        </a>

        <div class="member-card">
            <div class="card-letterhead">
                <span>Ministerio "La Gloria es del Señor"</span>
            </div>

            <div class="card-body">
                <div class="member-photo-frame">
                    <img id="profile-photo" class="profile-photo" src="https://via.placeholder.com/104x104?text=..." :src="$store.profile.photo" alt="Foto de perfil">
                    <div class="member-badge" aria-hidden="true">
                        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" /><path d="m9 12 2 2 4-4" /></svg>
                    </div>
                </div>

                <h1 id="profile-name" class="member-name" x-text="$store.profile.name">Cargando...</h1>
                <p class="member-subtitle">Miembro del ministerio</p>

                <div class="credential-fields">
                    <div class="credential-row">
                        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>
                        <span id="profile-email" class="email" x-text="$store.profile.email">email@ejemplo.com</span>
                    </div>
                    <div class="credential-row">
                        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" /><path d="m9 12 2 2 4-4" /></svg>
                        <span id="profile-provider" class="provider" x-text="$store.profile.provider">Conectado con Google</span>
                    </div>
                    <div class="credential-row">
                        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4" /><path d="M16 2v4" /><rect width="18" height="18" x="3" y="4" rx="2" /><path d="M3 10h18" /></svg>
                        <span id="profile-join-date" class="join-date" x-text="$store.profile.joinDateText">Miembro desde: ...</span>
                    </div>
                </div>
            </div>

            <div class="achievement-plaque">
                <div class="achievement-item">
                    <div class="achievement-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg></div>
                    <div class="achievement-number" id="visit-count" x-text="$store.profile.visitCount">0</div>
                    <div class="achievement-label">Visitas totales</div>
                </div>
                <div class="achievement-item">
                    <div class="achievement-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4" /><path d="M16 2v4" /><rect width="18" height="18" x="3" y="4" rx="2" /><path d="M3 10h18" /><path d="M8 14h.01" /><path d="M12 14h.01" /><path d="M16 14h.01" /><path d="M8 18h.01" /><path d="M12 18h.01" /><path d="M16 18h.01" /></svg></div>
                    <div class="achievement-number" id="days-member" x-text="$store.profile.daysMemberText">0</div>
                    <div class="achievement-label">Días como miembro</div>
                </div>
                <div class="achievement-item">
                    <div class="achievement-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" /></svg></div>
                    <div class="achievement-number" id="last-visit" x-text="$store.profile.lastVisitText">Hoy</div>
                    <div class="achievement-label">Última visita</div>
                </div>
            </div>

            <div class="account-actions">
                <button class="action-btn" onclick="clearHistory()">
                    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21" /><path d="m5.082 11.09 8.828 8.828" /></svg>
                    Limpiar historial
                </button>
                <button class="action-btn action-btn--danger" onclick="deleteAccount()">
                    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6" /><path d="M14 11v6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg>
                    Eliminar cuenta
                </button>
            </div>
        </div>

        <div class="ledger-section">
            <h2 class="ledger-title">
                <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 12h-5" /><path d="M15 8h-5" /><path d="M19 17V5a2 2 0 0 0-2-2H4" /><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3" /></svg>
                Bitácora de actividad
            </h2>
            <div id="activity-list">
                <template x-for="(item, index) in $store.profile.activities" :key="index">
                    <div class="activity-item">
                        <div class="activity-icon" x-html="item.icon"></div>
                        <div class="activity-content">
                            <strong x-text="item.title"></strong>
                            <p x-text="item.description"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script type="module" src="/js/profile.js"></script>
</body>
</html>
